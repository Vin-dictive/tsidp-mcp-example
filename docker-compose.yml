services:
  # Separate tailnet node. No auth key on purpose: the container prints a
  # login URL that has to be approved in the existing tailnet.
  tsidp:
    image: ghcr.io/tailscale/tsidp:latest
    container_name: tsidp-mcp-idp
    volumes:
      - tsidp-data:/data
    environment:
      TAILSCALE_USE_WIP_CODE: "1"
      TS_STATE_DIR: /data
      TS_HOSTNAME: idp
      TSIDP_ENABLE_STS: "1"
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: tsidp-mcp-db
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop-local
      POSTGRES_DB: shop
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - tsidp-mcp-pg:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  tsidp-mcp-pg:
  tsidp-data:
