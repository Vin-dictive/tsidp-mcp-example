# Three services, two of them tailnet nodes. The catalog is a SQLite file in a
# volume on the shop service, so there is no database container and nothing for
# the MCP server to wait on.
services:
  tsidp:
    image: ghcr.io/tailscale/tsidp:latest
    container_name: tsidp-mcp-idp
    volumes:
      - tsidp-data:/data
    environment:
      TAILSCALE_USE_WIP_CODE: "1"
      TS_STATE_DIR: /data
      TS_HOSTNAME: ${TSIDP_HOSTNAME:-idp}
      TSIDP_ENABLE_STS: "1"
      # tsidp is a tsnet app, so its tag cannot come from TS_EXTRA_ARGS.
      # tsnet takes tags from TS_ADVERTISE_TAGS, which is what lets one
      # OAuth client secret tag this node differently from ts-shop.
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_ADVERTISE_TAGS: ${TSIDP_TAG:-tag:tsidp}
      # tsnet ignores TS_AUTHKEY whenever /data already holds a logged-in
      # node, which would silently keep an older untagged identity. Forcing
      # login makes the key (and so the tag) apply on every start.
      TSNET_FORCE_LOGIN: "1"
    restart: unless-stopped

  # Userspace Tailscale: no /dev/net/tun, so it runs on Docker Desktop.
  # Serve publishes the MCP server on HTTPS :443 and the call inspector on :8443.
  ts-shop:
    image: tailscale/tailscale:latest
    container_name: tsidp-mcp-shop-ts
    hostname: ${SHOP_HOSTNAME:-shop-mcp}
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_AUTH_ONCE: "true"
      TS_HOSTNAME: ${SHOP_HOSTNAME:-shop-mcp}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_ACCEPT_DNS: "false"
      TS_SERVE_CONFIG: /config/serve.json
      TS_OUTBOUND_HTTP_PROXY_LISTEN: 127.0.0.1:1055
      # This container runs real tailscaled, so its tag goes through
      # tailscale up. With an OAuth client secret in TS_AUTHKEY, tailscaled
      # mints a key carrying exactly this tag.
      TS_EXTRA_ARGS: --advertise-tags=${MCP_TAG:-tag:mcpserver}
    volumes:
      - shop-ts-state:/var/lib/tailscale
      - ./ts-shop:/config
    restart: unless-stopped

  shop:
    build: ./server
    container_name: tsidp-mcp-shop
    network_mode: service:ts-shop
    depends_on:
      ts-shop:
        condition: service_started
    environment:
      PORT: "9933"
      INSPECTOR_PORT: "9934"
      # Created and seeded on first open. Read tools open it readOnly.
      DATABASE_PATH: /data/shop.db
      TSIDP_URL: ${TSIDP_URL:?Set TSIDP_URL in .env}
      RESOURCE_URL: ${SHOP_RESOURCE_URL:?Set SHOP_RESOURCE_URL to https://<shop-hostname>.<tailnet>.ts.net/mcp}
      HTTPS_PROXY: http://127.0.0.1:1055
      HTTP_PROXY: http://127.0.0.1:1055
      NO_PROXY: localhost,127.0.0.1
    volumes:
      - shop-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9933/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

volumes:
  tsidp-data:
  shop-ts-state:
  shop-data:
